name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 產物（index.html）是不是跟 src/ 同步：幾秒就有答案，先擋最常見的錯
      - name: index.html 與 src/ 同步
        run: node build.mjs --check

      - name: 找瀏覽器
        run: |
          for p in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser /usr/bin/microsoft-edge; do
            if [ -x "$p" ]; then
              echo "CHROME_PATH=$p" >> "$GITHUB_ENV"
              "$p" --version
              exit 0
            fi
          done
          echo "runner 上找不到 Chrome/Chromium" >&2
          exit 1

      # 全部測試：59 個版型 × 5 種尺寸、編輯器行為、5 種尺寸的 PNG／PPTX 匯出
      - name: 測試
        env:
          CHROME_FLAGS: --no-sandbox --disable-dev-shm-usage
        run: |
          set -o pipefail
          node test/run.mjs 2>&1 | tee test.log

      # 失敗時把測試輸出放進 annotation，公開 API 也讀得到（不需要登入抓 log）
      - name: 失敗摘要
        if: failure()
        run: |
          # annotation 訊息要跳脫 % \r \n，不然 % 會吃掉後面的字、換行會截斷
          esc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}'; }
          if [ ! -e test.log ]; then
            echo "::error::測試沒有跑：前面的步驟（index.html 同步檢查或找瀏覽器）就失敗了，請看那一步的輸出"
          elif [ -s test.log ]; then
            echo "::error::$(grep -E '^(FAIL|[0-9]+ passed)|^     ' test.log | head -40 | esc)"
          else
            echo "::error::test.log 是空的，測試可能在啟動階段就掛了"
          fi

      - name: 失敗時留下測試輸出
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log
          path: |
            test.log
            test/.downloads/
          if-no-files-found: ignore
          retention-days: 7
