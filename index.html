<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>圖片排版產生器</title>
<style>
:root{--bg:#f3f1ed;--panel:#fff;--ink:#222;--muted:#7a756d;--line:#e3dfd8;--acc:#2f5d8a;--chip:#f6f4f0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1a1b1d;--panel:#24262a;--ink:#ececec;--muted:#9a9a9a;--line:#3a3d42;--acc:#86b4e4;--chip:#2c2f34}}
:root[data-theme="dark"]{--bg:#1a1b1d;--panel:#24262a;--ink:#ececec;--muted:#9a9a9a;--line:#3a3d42;--acc:#86b4e4;--chip:#2c2f34}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Microsoft JhengHei','PingFang TC',system-ui,sans-serif}
.app{display:grid;grid-template-columns:370px 1fr;height:100vh}
aside{overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:16px 16px 40px}
main{overflow:auto;padding:18px 22px 40px;min-width:0}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--muted);font-size:12px;margin:0 0 8px}
h2{font-size:13px;color:var(--muted);margin:20px 0 8px;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
h2 .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--panel);font-size:12px;margin-right:6px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--acc);color:var(--acc)}
.lib{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.lib .it{position:relative;aspect-ratio:3/4;border-radius:6px;overflow:hidden;cursor:pointer;outline:2px solid transparent;background:var(--chip)}
.lib .it img{width:100%;height:100%;object-fit:cover;display:block}
.lib .it.on{outline-color:var(--acc)}
.lib .it.on::after{content:attr(data-n);position:absolute;top:4px;left:4px;background:var(--acc);color:var(--panel);font-weight:700;font-size:12px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.order{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;min-height:20px}
.order .o{flex:0 0 74px;position:relative;cursor:grab}
.order .o img{width:74px;height:56px;object-fit:cover;border-radius:6px;display:block}
.order .o .b{position:absolute;top:2px;left:2px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;border-radius:8px;padding:0 6px}
.order .o .ctl{display:flex;justify-content:space-between;margin-top:2px}
.order .o button{border:0;background:var(--chip);color:var(--ink);border-radius:4px;font-size:11px;padding:1px 6px;cursor:pointer}
.order .o.drag{opacity:.4}
.empty{color:var(--muted);font-size:12px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:7px;padding:7px 9px;font:inherit}
textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sw button{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);outline:1px solid var(--line);cursor:pointer;flex:none}
input[type=color]{width:44px;height:34px;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--chip);flex:none}
.biz{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.biz button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:7px;padding:5px 7px;cursor:pointer;font:inherit;font-size:12px}
.biz i{width:14px;height:14px;border-radius:3px;flex:none}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:7px;padding:7px 12px;cursor:pointer;font:inherit;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--panel);border-color:var(--acc);font-weight:700}
.mini{font-size:12px;padding:3px 8px}
.chk{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--ink);margin-top:10px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .tt{font-size:17px;font-weight:700;margin-right:auto}
.bar .tt small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.stage{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 6px 30px rgba(0,0,0,.12);max-width:1200px}
.stage svg,.card svg{display:block;width:100%;height:auto}
.note{font-size:12px;color:#b06a00;margin:8px 0 0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:22px}
.card{background:var(--panel);border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:.15s}
.card:hover{transform:translateY(-2px)}
.card.on{border-color:var(--acc)}
.card .meta{padding:6px 10px 8px}
.card .nm{font-weight:700;font-size:13px}
.card .hint{font-size:11px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:900px){.app{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:1px solid var(--line)}main{padding:16px}}
</style>
</head>
<body>
<div class="app">
<aside>
  <h1>圖片排版產生器</h1>
  <p class="sub">上傳圖片 → 點選並排列順序 → 輸入文字 → 選範本 → 下載 PNG（16:9，可直接貼進 PPT）</p>

  <h2><span><span class="n">1</span>上傳圖片</span><span><button class="btn mini" id="selAll">全選</button> <button class="btn mini" id="selNone">清除選擇</button></span></h2>
  <div class="drop" id="drop">點此選擇或拖曳圖片到這裡（可多張，也可 Ctrl+V 貼上）</div>
  <input type="file" id="file" accept="image/*" multiple hidden>
  <div class="lib" id="lib"></div>
  <div class="row" style="margin-top:6px"><span class="empty" id="libInfo"></span><button class="btn mini" id="delUnsel" style="flex:none">移除未選的圖</button></div>

  <h2><span><span class="n">2</span>使用順序（可拖曳）</span></h2>
  <div class="order" id="order"></div>

  <h2><span><span class="n">3</span>文字</span></h2>
  <label>標題</label><input type="text" id="title">
  <label>副標題 / 英文</label><input type="text" id="subtitle">
  <label>內文</label><textarea id="body"></textarea>
  <label>項目清單（目錄／商務範本用；每行一項，用「|」分隔，例如「85%|客戶滿意度|說明」）</label><textarea id="items"></textarea>
  <label>大數字（大數字範本用）</label><input type="text" id="number">

  <h2><span><span class="n">4</span>風格</span></h2>
  <div class="row"><input type="color" id="color"><button class="btn" id="pick">從第 1 張圖取色</button></div>
  <div class="sw" id="sw"></div>
  <label>輔色（商務範本的強調色）</label>
  <div class="row"><input type="color" id="accent"><span class="empty">數字、線條、色塊點綴</span></div>
  <label>商務配色組（一鍵套用主色＋輔色）</label>
  <div class="biz" id="biz"></div>
  <label>標題字體</label><select id="tf"></select>
  <label>內文字體</label><select id="bf"></select>
  <label class="chk"><input type="checkbox" id="single"> 多張時也只用第 1 張圖，讓所有形狀連成一張完整畫面（只選 1 張時自動如此）</label>

  <h2><span><span class="n">5</span>Logo 與頁尾</span></h2>
  <div class="row"><button class="btn" id="logoBtn">上傳 Logo</button><button class="btn" id="logoDel" style="flex:none">移除</button></div>
  <input type="file" id="logoFile" accept="image/*" hidden>
  <div class="row" style="margin-top:6px"><img id="logoPrev" alt="" style="max-height:40px;max-width:140px;flex:none;display:none"><select id="logoPos"><option value="tr">右上角</option><option value="tl">左上角</option><option value="br">右下角</option><option value="bl">左下角</option></select></div>
  <label class="chk"><input type="checkbox" id="logoBg"> Logo 加白色底框（放在照片上比較清楚）</label>
  <label>公司／單位名稱</label><input type="text" id="company" placeholder="例如：ABC 股份有限公司">
  <div class="row"><div><label>日期</label><input type="text" id="date" placeholder="2026.10"></div><div><label>頁碼</label><input type="text" id="page" placeholder="P.01"></div></div>
  <label class="chk"><input type="checkbox" id="footer"> 在右下角顯示頁尾（公司｜日期｜頁碼）</label>
</aside>
<main>
  <div class="bar">
    <div class="tt" id="curName"></div>
    <button class="btn" id="copy">複製圖片</button>
    <button class="btn" id="dl1">下載 PNG</button>
    <button class="btn pri" id="dl2">下載高清 PNG (2×)</button>
  </div>
  <div class="stage" id="stage"></div>
  <p class="note" id="note"></p>
  <div class="gal" id="gal"></div>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
const W=1920,H=1080;
const FONTS=[
 ["微軟正黑體","'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif"],
 ["標楷體","'DFKai-SB','BiauKai','KaiTi','STKaiti',serif"],
 ["新細明體","'PMingLiU','MingLiU','Songti TC',serif"],
 ["思源宋體 / Noto Serif","'Noto Serif TC','Source Han Serif TC','Noto Serif CJK TC','Songti TC',serif"],
 ["微軟雅黑","'Microsoft YaHei','PingFang SC',sans-serif"],
 ["Georgia（英文襯線）","Georgia,'Times New Roman','PMingLiU',serif"],
 ["Arial Black（英文粗體）","'Arial Black','Arial','Microsoft JhengHei',sans-serif"]];
const SWATCH=['#2f5d8a','#3f6b3a','#7a8f4e','#c2456b','#d9822b','#8a5a2b','#5b4b8a','#1f7a7a','#b03a2e','#3a3a3a'];
const DEF={title:'敦煌鳴沙山月牙泉',subtitle:'Dunhuang · Crescent Lake',body:'沙漠中的一彎清泉，千百年來不曾乾涸。駝鈴聲聲、沙丘連綿，日落時分整座山脊被染成金色，是絲路上最溫柔的風景。',items:'工作概述|Job Overview\n靈感來源|Source of Inspiration\n成果展示|Achievement\n目標規劃|Goals and Ideas',number:'01',color:'#2f5d8a',accent:'#c9a24a',tf:0,bf:0,single:false,tpl:'diamond',
  company:'',date:'',page:'',footer:false,logo:'',logoAR:1,logoPos:'tr',logoBg:true};
const BIZ=[['藏青金','#1f3a5f','#c9a24a'],['商務藍','#1d5fa8','#38b2e8'],['深灰橘','#3b3f46','#f08a24'],['墨綠米','#2f5a46','#d8b98a'],['酒紅灰','#7a2635','#a8a8a8'],['科技紫','#3b2f8f','#22c3c3']];

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const f1=n=>Math.round(n*10)/10;
const mctx=document.createElement('canvas').getContext('2d');
function tw(s,size,font,weight=400){mctx.font=`${weight} ${size}px ${font}`;return mctx.measureText(s).width}
function wrap(str,maxW,size,font,weight=400){
  const out=[];
  for(const para of String(str||'').split('\n')){
    if(!para.trim()){if(out.length)out.push('');continue}
    const toks=para.match(/[A-Za-z0-9À-ɏ'’\-.,:;!?()"&]+\s*|\s+|./gu)||[];
    let line='';
    for(const t of toks){
      if(line&&tw((line+t).trimEnd(),size,font,weight)>maxW){out.push(line.trimEnd());line=t.trimStart()}
      else line+=t;
    }
    if(line.trim())out.push(line.trimEnd());
  }
  return out;
}
function T(lines,{x,y,size,lh=1.5,fill='#333',font,weight=400,anchor='start',ls=0,op=1,extra=''}){
  if(!lines.length)return '';
  return `<text x="${f1(x)}" y="${f1(y)}" font-size="${size}" font-family="${esc(font)}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}" letter-spacing="${ls}" opacity="${op}" ${extra}>`+
    lines.map((l,i)=>`<tspan x="${f1(x)}" dy="${i?f1(size*lh):0}">${esc(l)||' '}</tspan>`).join('')+`</text>`;
}
function VT(str,{x,y,size,gap=1.12,fill='#333',font,weight=400,op=1,extra=''}){
  const ch=[...String(str||'')];
  return `<text font-size="${size}" font-family="${esc(font)}" font-weight="${weight}" fill="${fill}" text-anchor="middle" opacity="${op}" ${extra}>`+
    ch.map((c,i)=>`<tspan x="${f1(x)}" y="${f1(y+i*size*gap)}">${esc(c)}</tspan>`).join('')+`</text>`;
}
const IMG=(im,x,y,w,h,a='')=>`<image href="${im.src}" x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" preserveAspectRatio="xMidYMid slice" ${a}/>`;
const bg=col=>`<rect width="${W}" height="${H}" fill="${col}"/>`;
const P=pts=>'M'+pts.map(p=>f1(p[0])+','+f1(p[1])).join('L')+'Z';
function bbox(pts){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const[x,y]of pts){a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);d=Math.max(d,y)}return[a,b,c-a,d-b]}
function unionB(sh){return bbox(sh.flatMap(s=>[[s.b[0],s.b[1]],[s.b[0]+s.b[2],s.b[1]+s.b[3]]]))}
function rot(pts,ang,tx,ty){const r=ang*Math.PI/180,c=Math.cos(r),s=Math.sin(r);return pts.map(([x,y])=>[tx+x*c-y*s,ty+x*s+y*c])}
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const uniOf=c=>c.imgs.length===1||c.single;

/* shapes → clipped images. Shape: {el:'<path …/>', b:[x,y,w,h]} */
function mosaic(c,shapes,{shadow=true,box=null,attr=''}={}){
  let defs='',body='';
  if(uniOf(c)){
    const id=c.id();defs=`<clipPath id="${id}">${shapes.map(s=>s.el).join('')}</clipPath>`;
    const b=box||unionB(shapes);body=IMG(c.imgs[0],...b,`clip-path="url(#${id})"`);
  }else shapes.forEach((s,i)=>{const id=c.id();defs+=`<clipPath id="${id}">${s.el}</clipPath>`;body+=IMG(c.imgs[i%c.imgs.length],...s.b,`clip-path="url(#${id})"`)});
  return `<defs>${defs}</defs><g ${shadow?`filter="url(#${c.sh})"`:''} ${attr}>${body}</g>`;
}
/* left/centered text stack, vertically centred on cy */
function stack(c,{x,cy,w,anchor='start',tSize=84,tColor,sColor,bColor='#4a4a4a',bSize=26,line=true,tWeight=700,sSize=30,maxBody=8}){
  let s='',y=0;const tl=wrap(c.t.title,w,tSize,c.tf,tWeight);
  s+=T(tl,{x,y,size:tSize,lh:1.18,fill:tColor,font:c.tf,weight:tWeight,anchor});y+=(tl.length-1)*tSize*1.18;
  if(c.t.subtitle){y+=sSize+26;const sl=wrap(c.t.subtitle,w,sSize,c.bf,600);s+=T(sl,{x,y,size:sSize,lh:1.3,fill:sColor,font:c.bf,weight:600,ls:2,anchor});y+=(sl.length-1)*sSize*1.3}
  if(line){y+=34;const lx=anchor==='middle'?x-40:anchor==='end'?x-80:x;s+=`<rect x="${lx}" y="${y}" width="80" height="5" rx="2.5" fill="${sColor}"/>`;y+=8}
  if(c.t.body){y+=bSize*1.9;const bl=wrap(c.t.body,w,bSize,c.bf).slice(0,maxBody);s+=T(bl,{x,y,size:bSize,lh:1.75,fill:bColor,font:c.bf,anchor});y+=(bl.length-1)*bSize*1.75}
  const top=-tSize*.85,bot=y+10;
  return `<g transform="translate(0 ${f1(cy-(top+bot)/2)})">${s}</g>`;
}
function items(c){const it=String(c.t.items||'').split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{const[a,b='',...r]=s.split(/[|｜]/);return{a:a.trim(),b:b.trim(),c:r.join(' ').trim()}});return it.length?it:[{a:'項目一',b:''},{a:'項目二',b:''},{a:'項目三',b:''}]}
const nOf=(c,min=2,max=6,def=4)=>c.imgs.length>1&&!c.single?Math.max(min,Math.min(max,c.imgs.length)):def;
const pad2=i=>String(i+1).padStart(2,'0');
function strip(x0,x1,n,gap){const w=(x1-x0-(n-1)*gap)/n;return[...Array(n)].map((_,i)=>[x0+i*(w+gap),x0+i*(w+gap)+w])}
function band(xa,xb,top,bot,steps=18){const t=[],b=[];for(let k=0;k<=steps;k++){const x=xa+(xb-xa)*k/steps;t.push([x,top(x)]);b.unshift([x,bot(x)])}return t.concat(b)}
const polyShape=pts=>({el:`<path d="${P(pts)}"/>`,b:bbox(pts)});
function annular(cx,cy,R,r,a0,a1){const p=(rad,a)=>[cx+rad*Math.cos(a),cy+rad*Math.sin(a)],L=a1-a0>Math.PI?1:0;const[o0,o1,i1,i0]=[p(R,a0),p(R,a1),p(r,a1),p(r,a0)];
  const d=`M${f1(o0[0])},${f1(o0[1])}A${R},${R} 0 ${L} 1 ${f1(o1[0])},${f1(o1[1])}L${f1(i1[0])},${f1(i1[1])}A${r},${r} 0 ${L} 0 ${f1(i0[0])},${f1(i0[1])}Z`;
  const pts=[];for(let k=0;k<=8;k++){const a=a0+(a1-a0)*k/8;pts.push(p(R,a),p(r,a))}return{el:`<path d="${d}"/>`,b:bbox(pts)}}

/* ---------- templates ---------- */
const TPL=[];const def=o=>TPL.push(o);

def({id:'diamond',name:'菱形拼貼',hint:'多張循環（共 21 格）',render(c){
  const a=150,D=a*Math.SQRT2,st=(D+18)/2,cx=960,cy=548;
  const cells=[[-4,-2],[2,-2],[-5,-1],[-3,-1],[1,-1],[3,-1],[-6,0],[-4,0],[-2,0],[0,0],[2,0],[4,0],[6,0],[-5,1],[-3,1],[-1,1],[1,1],[3,1],[5,1],[-2,2],[4,2]];
  const sh=cells.map(([i,j])=>{const x=cx+i*st,y=cy+j*st;return{el:`<rect x="${-a/2}" y="${-a/2}" width="${a}" height="${a}" rx="22" transform="translate(${f1(x)} ${f1(y)}) rotate(45)"/>`,b:[x-D/2,y-D/2,D,D]}});
  return bg(c.col.light)+T(wrap(c.t.title,1600,74,c.tf,700).slice(0,1),{x:960,y:138,size:74,fill:c.col.dark,font:c.tf,weight:700,anchor:'middle'})
   +T([c.t.subtitle],{x:960,y:192,size:26,fill:c.col.main,font:c.bf,weight:600,ls:6,anchor:'middle'})
   +mosaic(c,sh)+T(wrap(c.t.body,1400,25,c.bf).slice(0,2),{x:960,y:950,size:25,lh:1.7,fill:'#555',font:c.bf,anchor:'middle'});
}});

def({id:'heart',name:'心形拼貼',hint:'多張循環（約 45 格）',render(c){
  const cx=1330,cy=540,k=26,s=58,st=68,sh=[];
  const outline=[...Array(72)].map((_,i)=>{const t=i/72*Math.PI*2;return[cx+k*16*Math.sin(t)**3,cy-20-k*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))]});
  const inside=(x,y)=>{let o=false;for(let i=0,j=71;i<72;j=i++){const[a,b]=outline[i],[p,q]=outline[j];if((b>y)!==(q>y)&&x<(p-a)*(y-b)/(q-b)+a)o=!o}return o};
  for(let gy=cy-476;gy<=cy+476;gy+=st)for(let gx=cx-476;gx<=cx+476;gx+=st)
    if(inside(gx,gy))sh.push({el:`<rect x="${gx-s/2}" y="${gy-s/2}" width="${s}" height="${s}" rx="14"/>`,b:[gx-s/2,gy-s/2,s,s]});
  return bg(mix(c.col.light,'#ffffff',.4))+`<circle cx="${cx}" cy="${cy}" r="430" fill="${c.col.light}"/>`+mosaic(c,sh)
   +stack(c,{x:150,cy:540,w:640,tSize:80,tColor:c.col.dark,sColor:c.col.main});
}});

def({id:'hex',name:'六邊形蜂巢',hint:'多張循環（約 20 格）',render(c){

  for(let j=-2;j<=2;j++)for(let i=-4;i<=4;i++){
    const x=cx+(i+(j&1)*.5)*Math.sqrt(3)*r,y=cy+j*1.5*r;
    if(((x-cx)/520)**2+((y-cy)/390)**2>1)continue;
    const pts=[...Array(6)].map((_,k)=>{const a=(60*k-90)*Math.PI/180;return[x+dr*Math.cos(a),y+dr*Math.sin(a)]});sh.push(polyShape(pts));
  }
  return bg(c.col.light)+mosaic(c,sh)+stack(c,{x:140,cy:540,w:560,tSize:82,tColor:c.col.dark,sColor:c.col.main});
}});

def({id:'tree',name:'葉形大樹',hint:'1 張最佳（也可多張）',render(c){

  for(let k=0;k<7;k++){const y=905-k*105,L=330-k*30,h=L*.42;sh.push(leaf(L,h,205,tx-6,y),leaf(L,h,335,tx+6,y-40))}

}});

def({id:'pixel',name:'方塊溶解',hint:'1 張（人像很適合）',render(c){

   +acc+IMG(c.imgs[0],520,0,1400,H,`mask="url(#${m})"`)

function makeSamples(){
  const hues=[[200,35],[140,90],[30,200],[330,280],[260,180],[90,40]];
  return hues.map(([h1,h2],k)=>{const cv=document.createElement('canvas');cv.width=1200;cv.height=800;const x=cv.getContext('2d');
    const g=x.createLinearGradient(0,0,0,800);g.addColorStop(0,`hsl(${h1},70%,78%)`);g.addColorStop(1,`hsl(${h2},60%,88%)`);x.fillStyle=g;x.fillRect(0,0,1200,800);
    x.fillStyle=`hsla(${h2},90%,92%,.9)`;x.beginPath();x.arc(820,260,90,0,7);x.fill();const r=rng(k+3);
    for(let l=0;l<4;l++){x.fillStyle=`hsl(${(h1+l*25)%360},${45+l*8}%,${62-l*12}%)`;x.beginPath();x.moveTo(0,800);const base=380+l*110,a=r()*6;
      for(let i=0;i<=1200;i+=20)x.lineTo(i,base-Math.sin(i/180+a)*60-Math.sin(i/63+a*2)*18);x.lineTo(1200,800);x.fill()}
    const d=cv.toDataURL('image/jpeg',.85);return{src:d,thumb:d,full:d,data:d}});
}
function scaleBlob(bmp,max,q){const s=Math.min(1,max/Math.max(bmp.width,bmp.height)),cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);return new Promise(r=>cv.toBlob(r,'image/jpeg',q))}
let nid=0;
async function addFiles(files){
  const fs=[...files].filter(f=>f.type.startsWith('image/'));if(!fs.length)return;toast(`處理 ${fs.length} 張圖片中…`);
  for(const f of fs){try{const bmp=await createImageBitmap(f);const full=await scaleBlob(bmp,2400,.9),th=await scaleBlob(bmp,520,.82);
    const it={id:++nid,name:f.name,full:URL.createObjectURL(full),thumb:URL.createObjectURL(th),blob:full};lib.push(it);sel.push(it.id)}catch(e){console.warn(e)}}
  drawLib();refresh();toast(`已加入 ${fs.length} 張`);
}
const blobToData=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});

function chosen(kind){const L=sel.map(id=>lib.find(x=>x.id===id)).filter(Boolean);
  if(!L.length)return samples.map(s=>({src:s.src}));return L.map(x=>({src:x[kind]}))}
function colors(){const m=S.color;return{main:m,acc:S.accent||m,dark:mix(m,'#000000',.45),soft:mix(m,'#ffffff',.55),light:mix(m,'#ffffff',.9)}}

function chrome(c){
  let s='';const pos=S.logoPos||'tr';
  if(S.logo){const h=70,w=h*(S.logoAR||1),p=14,x=pos[1]==='r'?W-40-w-p*2:40,y=pos[0]==='t'?36:H-36-h-p*2;
    if(S.logoBg)s+=`<rect x="${f1(x)}" y="${y}" width="${f1(w+p*2)}" height="${h+p*2}" rx="14" fill="#fff" opacity=".92"/>`;
    s+=`<image href="${S.logo}" x="${f1(x+p)}" y="${y+p}" width="${f1(w)}" height="${h}" preserveAspectRatio="xMidYMid meet"/>`}
  const t=S.footer?[S.company,S.date,S.page].map(v=>String(v||'').trim()).filter(Boolean).join('   |   '):'';

function renderSVG(tpl,imgs,pre){
  let k=0;const c={imgs,t:S,col:colors(),tf:FONTS[S.tf][1],bf:FONTS[S.bf][1],single:S.single,id:()=>pre+'x'+(k++),sh:pre+'sh',ts:pre+'ts'};

   `<filter id="${pre}sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".22"/></filter>`+

}

  cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  S.logo=cv.toDataURL('image/png');S.logoAR=cv.width/cv.height;save();showLogo();refresh();toast('已加入 Logo')}catch(err){toast('Logo 讀取失敗')}};

$('pick').onclick=()=>{const src=chosen('thumb')[0].src,im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=cv.height=40;const x=cv.getContext('2d');x.drawImage(im,0,0,40,40);
  const d=x.getImageData(0,0,40,40).data,bins=Array.from({length:12},()=>({w:0,r:0,g:0,b:0}));
  for(let i=0;i<d.length;i+=4){const[r,g,b]=[d[i],d[i+1],d[i+2]],mx=Math.max(r,g,b),mn=Math.min(r,g,b),s=mx?(mx-mn)/mx:0;if(s<.15||mx<40)continue;
    let h;if(mx===r)h=((g-b)/(mx-mn)+6)%6;else if(mx===g)h=(b-r)/(mx-mn)+2;else h=(r-g)/(mx-mn)+4;const bi=bins[Math.floor(h*2)%12],w=s*mx;bi.w+=w;bi.r+=r*w;bi.g+=g*w;bi.b+=b*w}
  const best=bins.sort((a,b)=>b.w-a.w)[0];if(!best.w){toast('這張圖顏色太淡，取不到主色');return}
  let col='#'+[best.r,best.g,best.b].map(v=>Math.round(v/best.w).toString(16).padStart(2,'0')).join('');
  const[r,g,b]=hex2rgb(col),L=(Math.max(r,g,b)+Math.min(r,g,b))/510;if(L>.5)col=mix(col,'#000000',(L-.45)/L);
  S.color=col;$('color').value=col;save();refresh();toast('已套用圖片主色 '+col)};im.src=src};

function refresh(){clearTimeout(refresh._t);refresh._t=setTimeout(draw,120)}
function draw(){
  const tpl=TPL.find(t=>t.id===S.tpl)||TPL[0];S.tpl=tpl.id;
  $('curName').innerHTML=`${esc(tpl.name)}<small>建議：${esc(tpl.hint)}</small>`;
  $('stage').innerHTML=renderSVG(tpl,chosen('full'),'m_');
  $('note').textContent=sel.length?'':'※ 目前用的是示意圖，上傳並點選圖片後就會換成你的圖片。';
  const th=chosen('thumb');
  $('gal').innerHTML=TPL.map(t=>`<div class="card ${t.id===tpl.id?'on':''}" data-id="${t.id}">${renderSVG(t,th,'g'+t.id+'_')}<div class="meta"><div class="nm">${esc(t.name)}</div><div class="hint">${esc(t.hint)}</div></div></div>`).join('');
}
$('gal').onclick=e=>{const c=e.target.closest('.card');if(!c)return;S.tpl=c.dataset.id;save();draw();window.scrollTo({top:0,behavior:'smooth'});document.querySelector('main').scrollTo({top:0,behavior:'smooth'})};

async function toPNG(scale){
  const tpl=TPL.find(t=>t.id===S.tpl);const L=sel.map(id=>lib.find(x=>x.id===id)).filter(Boolean);
  const imgs=L.length?await Promise.all(L.map(async it=>({src:it.data||(it.data=await blobToData(it.blob))}))):samples.map(s=>({src:s.data}));
  const svg=renderSVG(tpl,imgs,'e_'),url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
  const im=new Image();await new Promise((res,rej)=>{im.onload=res;im.onerror=rej;im.src=url});await new Promise(r=>setTimeout(r,60));
  const cv=document.createElement('canvas');cv.width=W*scale;cv.height=H*scale;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
  return new Promise(r=>cv.toBlob(r,'image/png'));
}
async function download(scale){try{toast('產生圖片中…');const b=await toPNG(scale),a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=`${(S.title||'排版').replace(/[\\/:*?"<>|]/g,'')}_${S.tpl}${scale>1?'_2x':''}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('已下載')}catch(e){console.error(e);toast('下載失敗：'+e.message)}}
$('dl1').onclick=()=>download(1);$('dl2').onclick=()=>download(2);
$('copy').onclick=async()=>{try{const b=await toPNG(1);await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('已複製，可直接到 PPT 貼上')}catch(e){toast('此瀏覽器不支援複製，請改用下載')}};

samples=makeSamples();drawLib();draw();
</script>
